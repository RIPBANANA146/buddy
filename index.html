<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desk Buddy</title>
<style>
:root{--bg:#f6f6f3;--fg:#1c1c1a;--card:#fff;--muted:#6b6b66;--acc:#2f6fed;--bd:#dcdcd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#eeeeea;--card:#222220;--muted:#9a9a94;--acc:#6b9bff;--bd:#3a3a36}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:520px;margin:0 auto}
h1{font-size:20px;margin:0 0 12px}
button,input,select,textarea{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 14px}
button{width:100%}input,select,textarea{width:100%;margin-bottom:8px}textarea{min-height:130px;resize:vertical}
#talk{background:var(--acc);color:#fff;border:0;font-size:20px;padding:26px;margin:12px 0}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}.row input{margin:0;min-width:0}.row button{width:auto}
#log{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;min-height:120px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.pill{font-size:14px;color:var(--muted);margin:8px 0}
label{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:10px}
details{margin-bottom:10px}summary{color:var(--muted);margin-bottom:8px}
</style></head><body>
<h1>Desk Buddy</h1>
<details id="set"><summary>Settings (Google AI Studio key)</summary>
<input id="key" type="password" placeholder="Paste your Google AI Studio API key" autocomplete="off">
<input id="model" placeholder="Models, tried in order" value="gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-3.5-flash">
<button id="load" style="margin-bottom:8px">Load the list of available models</button>
<select id="pick"><option value="">Pick a model to add to the list…</option></select>
<label style="margin:6px 0">Voice (from your phone)</label>
<select id="voice"><option value="">Phone default</option></select>
<select id="rate"><option value="0.85">Speed: slow</option><option value="1" selected>Speed: normal</option><option value="1.15">Speed: fast</option><option value="1.3">Speed: faster</option></select>
<button id="testv" style="margin-bottom:8px">Test the voice</button>
<label style="margin:6px 0">Personality (tell the buddy how to act)</label>
<textarea id="persona"></textarea>
<button id="save">Save</button></details>
<button id="conn">1. Connect to the buddy face</button>
<div class="pill" id="st">Not connected</div>
<button id="talk">2. Tap to talk</button>
<button id="cam">📷 Take a photo for the buddy to see</button><input type="file" id="camfile" accept="image/*" capture="environment" hidden>
<div class="pill" id="camst"></div>
<label><input type="checkbox" id="keep" style="width:auto;margin:0"> Keep listening after each reply</label>
<div class="row" style="margin-top:12px"><input id="typed" placeholder="Or type a message…"><button id="go">Send</button></div>
<div id="log">Conversation will appear here.</div>
<script>
const SVC="6e400001-b5a3-f393-e0a9-e50e24dcca9e",RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const DEFAULT_PERSONA="You are Buddy, a playful, curious little desk companion with a warm sense of humor. Talk like a close friend: react to what the person says, tease them gently, share a quick opinion, and ask a short follow-up question about half the time. Use what they told you earlier in the conversation. Keep every reply to 1-3 short spoken sentences. Plain text only: no markdown, no lists, no emoji.";
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let ch=null,q=Promise.resolve(),busy=false,history=[],pendingImg=null;
const enc=new TextEncoder();
const status=t=>$("st").textContent=t, log=t=>$("log").textContent=t;
$("key").value=store.get("gkey");if(store.get("gmodels"))$("model").value=store.get("gmodels");
if(!$("key").value)$("set").open=true;
$("persona").value=store.get("gpers")||DEFAULT_PERSONA;
$("rate").value=store.get("grate")||"1";
$("save").onclick=()=>{
  store.set("gkey",$("key").value.trim());store.set("gmodels",$("model").value.trim());
  store.set("gvoice",$("voice").value);store.set("grate",$("rate").value);
  store.set("gpers",$("persona").value.trim()===DEFAULT_PERSONA?"":$("persona").value.trim());
  $("set").open=false;log("Saved.");
};
const GV=[["Puck","upbeat"],["Zephyr","bright"],["Fenrir","excitable"],["Leda","youthful"],["Aoede","breezy"],["Kore","firm"],["Charon","informative"],["Orus","firm"],["Algenib","gravelly"],["Sulafat","warm"],["Achird","friendly"],["Gacrux","mature"]];
function loadVoices(){
  const sel=$("voice"),keep=sel.value||store.get("gvoice")||"";
  sel.innerHTML="";
  const add=(parent,val,txt)=>{const o=document.createElement("option");o.value=val;o.textContent=txt;parent.appendChild(o);};
  add(sel,"","Phone default");
  const g=document.createElement("optgroup");g.label="Gemini voices (natural, uses your free quota)";
  GV.forEach(v=>add(g,"gemini:"+v[0],v[0]+" - "+v[1]));sel.appendChild(g);
  const pg=document.createElement("optgroup");pg.label="Phone voices";
  speechSynthesis.getVoices().forEach(v=>add(pg,v.name,v.name+" ("+v.lang+")"));sel.appendChild(pg);
  sel.value=keep;
}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
$("testv").onclick=()=>{getCtx();speak("Hi! I am your desk buddy. How is your day going?");};

// ---- Camera (phone photo) ----
$("cam").onclick=()=>$("camfile").click();
$("camfile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const bmp=await createImageBitmap(f);
    const sc=Math.min(1,768/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    pendingImg=c.toDataURL("image/jpeg",0.8).split(",")[1];
    $("camst").textContent="Photo attached. Now tap to talk or type your question.";
  }catch(err){$("camst").textContent="Could not read the photo: "+err.message;}
  e.target.value="";
};

// ---- Model list ----
$("load").onclick=async()=>{
  const key=$("key").value.trim()||store.get("gkey");
  if(!key){log("Paste your API key first.");return;}
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":key}});
    const j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
    const names=(j.models||[])
      .filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
      .map(m=>m.name.replace("models/",""))
      .filter(n=>/^gemini/.test(n)&&!/tts|image|embed|live|audio|robot|computer|veo/.test(n)).sort();
    $("pick").innerHTML='<option value="">Pick a model to add to the list…</option>'+names.map(n=>'<option>'+n+'</option>').join("");
    log("Found "+names.length+" models. Choose one from the dropdown to add it.");
  }catch(e){log("Could not load models: "+e.message);}
};
$("pick").onchange=()=>{
  const v=$("pick").value;if(!v)return;
  const cur=$("model").value.split(",").map(x=>x.trim()).filter(Boolean);
  if(!cur.includes(v))cur.push(v);
  $("model").value=cur.join(", ");$("pick").value="";
};

// ---- Bluetooth ----
function send(p,m){
  if(!ch)return;
  const bytes=enc.encode(p+":"+String(m).replace(/[^\x20-\x7E]/g,"?").slice(0,160)+"\n");
  q=q.then(async()=>{for(let i=0;i<bytes.length;i+=20)await ch.writeValue(bytes.slice(i,i+20));}).catch(()=>{});
}
$("conn").onclick=async()=>{
  if(!navigator.bluetooth){status("No Bluetooth here. Use Chrome on Android over https.");return;}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"Buddy"}],optionalServices:[SVC]});
    dev.addEventListener("gattserverdisconnected",()=>{ch=null;status("Disconnected");});
    const s=await (await dev.gatt.connect()).getPrimaryService(SVC);
    ch=await s.getCharacteristic(RX);
    status("Connected to "+dev.name);send("S","idle");send("T","Hi Osama!");
  }catch(e){status("Could not connect: "+e.message);}
};

// ---- Speech in / out ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
  return new Promise(res=>{
    if(!SR){log("Speech input isn’t available in this browser. Type instead.");res("");return;}
    const r=new SR();r.lang="en-US";r.interimResults=true;let got="";
    r.onresult=e=>{got=Array.from(e.results).map(x=>x[0].transcript).join(" ");log("Listening… "+got);};
    r.onend=()=>res(got.trim());r.onerror=()=>{};r.start();
  });
}
const TTS_MODEL="gemini-3.1-flash-tts-preview";
let actx=null;
function getCtx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!actx&&AC)actx=new AC();
  if(actx&&actx.state==="suspended")actx.resume();
  return actx;
}
async function geminiSpeak(text,voice){
  const key=store.get("gkey")||$("key").value.trim();
  if(!key)throw new Error("no API key");
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+TTS_MODEL+":generateContent",{
    method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
    body:JSON.stringify({contents:[{parts:[{text:"Say in a warm, playful, friendly tone: "+text}]}],
      generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
  const part=parts.find(x=>x.inlineData);
  if(!part)throw new Error("no audio returned");
  const bin=atob(part.inlineData.data),n=bin.length>>1,f=new Float32Array(n);
  for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;f[i]=v/32768;}
  const ctx=getCtx();if(!ctx)throw new Error("no audio output");
  const buf=ctx.createBuffer(1,n,24000);buf.getChannelData(0).set(f);
  return new Promise(res=>{
    const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
    src.onended=()=>res();send("S","speaking");src.start();
  });
}
function phoneSpeak(text,voiceName){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);
    const v=speechSynthesis.getVoices().find(x=>x.name===voiceName);
    if(v){u.voice=v;u.lang=v.lang;}
    u.rate=parseFloat($("rate").value)||1;
    u.onstart=()=>send("S","speaking");u.onend=u.onerror=()=>res();
    speechSynthesis.cancel();speechSynthesis.speak(u);
  });
}
function speak(text){
  const sel=$("voice").value;
  if(sel.indexOf("gemini:")===0){
    return geminiSpeak(text,sel.slice(7)).catch(e=>{
      $("camst").textContent="Gemini voice failed ("+e.message+"). Used the phone voice instead.";
      return phoneSpeak(text,"");
    });
  }
  return phoneSpeak(text,sel);
}

// ---- AI (Google Gemini) ----
async function ask(){
  const key=store.get("gkey");
  const models=($("model").value||"").split(",").map(x=>x.trim()).filter(Boolean);
  if(!key)throw new Error("Add your API key in Settings first.");
  const body=JSON.stringify({systemInstruction:{parts:[{text:((($("persona").value||"").trim())||DEFAULT_PERSONA)+" The current date and time is "+new Date().toLocaleString([],{dateStyle:"full",timeStyle:"short"})+"."}]},
    contents:history.slice(-9).map((m,i,a)=>({role:m.role,parts:[{text:m.text}].concat(m.img&&i===a.length-1?[{inlineData:{mimeType:"image/jpeg",data:m.img}}]:[])}))});
  let last="";
  for(const model of models){          // each model has its own free quota, so try the next one when one runs out
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent",{
      method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body});
    const j=await r.json().catch(()=>({}));
    if(r.ok)return ((j.candidates&&j.candidates[0]&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("").trim();
    last=(j.error&&j.error.message)||("HTTP "+r.status);
    if(![429,404,503].includes(r.status))throw new Error(last);
  }
  throw new Error("Every model is out of free requests for now. "+last);
}

// ---- Conversation ----
async function cycle(user){
  getCtx();busy=true;$("talk").disabled=true;const mic=(user==null);
  if(mic){send("S","listening");log("Listening…");user=await listen();}
  if(user.length>=2){
    send("S","thinking");send("T",user);log("You: "+user+"\n\nThinking…");
    history.push({role:"user",text:user,img:pendingImg});pendingImg=null;$("camst").textContent="";
    try{
      const reply=await ask();
      history.push({role:"model",text:reply});
      log("You: "+user+"\n\nBuddy: "+reply);send("T",reply);
      await speak(reply);
    }catch(e){log("AI error: "+e.message);send("T","AI error");history.pop();}
  }
  send("S","idle");busy=false;$("talk").disabled=false;
  if(mic&&$("keep").checked)setTimeout(()=>{if(!busy&&$("keep").checked)cycle(null)},600);
}
$("talk").onclick=()=>{if(!busy)cycle(null);};
$("go").onclick=()=>{const v=$("typed").value.trim();if(!v||busy)return;$("typed").value="";cycle(v);};
</script></body></html>
